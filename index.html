<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Keys para Admins</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212; color: #ffffff;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0;
        }
        .container {
            background-color: #1e1e1e; padding: 30px;
            border-radius: 12px; box-shadow: 0px 8px 20px rgba(0,0,0,0.5);
            width: 380px; text-align: center;
        }
        h2, h3 { color: #03dac6; margin-bottom: 20px; }
        input {
            width: 100%; padding: 10px; margin-bottom: 15px;
            border: 1px solid #333; border-radius: 6px;
            background-color: #2d2d2d; color: #fff; box-sizing: border-box;
        }
        button {
            width: 100%; padding: 12px; background-color: #03dac6;
            border: none; border-radius: 6px; color: #121212;
            font-size: 16px; font-weight: bold; cursor: pointer;
        }
        button:hover { background-color: #01bca7; }
        #error-msg { color: #cf6679; font-size: 14px; display: none; }
        
        .admin-panel { display: none; }
        .key-box {
            background-color: #2d2d2d; border: 1px dashed #03dac6;
            padding: 15px; border-radius: 8px; margin-top: 15px;
        }
        .key-display {
            font-family: monospace; font-size: 18px; color: #bb86fc;
            background-color: #121212; padding: 10px; border-radius: 6px;
            margin: 10px 0; word-break: break-all;
        }
        .lista-keys {
            text-align: left; max-height: 120px; overflow-y: auto;
            background: #121212; padding: 10px; border-radius: 6px; margin-top: 10px;
            font-size: 12px; color: #b3b3b3;
        }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN DO ADMIN -->
    <div class="container" id="telaLogin">
        <h2>Painel Admin Authenticator</h2>
        <form onsubmit="validarAdmin(event)">
            <input type="text" id="username" placeholder="Usuário Admin" required>
            <input type="password" id="password" placeholder="Senha" required>
            <button type="submit">Acessar Gerador</button>
            <p id="error-msg"></p>
        </form>
    </div>

    <!-- PAINEL DE GERAÇÃO EXCLUSIVO -->
    <div class="container admin-panel" id="painelAdmin">
        <h3>🔑 Gerador de Keys Ativo</h3>
        <p>Logado como: <strong>broto</strong></p>
        
        <div class="key-box">
            <div class="key-display" id="keyResult">NENHUMA KEY ATIVA</div>
            <button onclick="gerarChaveMestra()">Criar Nova Key</button>
        </div>

        <p style="margin-top: 15px; font-size: 14px; text-align: left; color: #b3b3b3;">Chaves Ativas no Sistema:</p>
        <div class="lista-keys" id="listaKeysContainer">Nenhuma chave gerada no banco de dados local.</div>

        <button style="background-color: #cf6679; color: white; margin-top: 15px; padding: 8px;" onclick="fazerLogout()">Desconectar</button>
    </div>

    <script>
        const ADMIN_USER = "broto";
        const ADMIN_PASS = "adminnnn";

        // Carrega chaves salvas ao abrir a página
        let bancoDeKeys = JSON.parse(localStorage.getItem("banco_keys")) || [];

        function validarAdmin(event) {
            event.preventDefault();
            const user = document.getElementById("username").value;
            const pass = document.getElementById("password").value;
            const msg = document.getElementById("error-msg");

            if (user === ADMIN_USER && pass === ADMIN_PASS) {
                document.getElementById("telaLogin").style.display = "none";
                document.getElementById("painelAdmin").style.display = "block";
                atualizarListaVisual();
            } else {
                msg.style.display = "block";
                msg.innerText = "Acesso negado! Apenas Administradores.";
            }
        }

        function gerarChaveMestra() {
            const caracteres = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let novaKey = 'KEY_';
            for (let i = 0; i < 10; i++) {
                novaKey += caracteres.charAt(Math.floor(Math.random() * caracteres.length));
            }

            document.getElementById("keyResult").innerText = novaKey;
            
            // Adiciona ao banco de dados local do navegador
            bancoDeKeys.push(novaKey);
            localStorage.setItem("banco_keys", JSON.stringify(bancoDeKeys));
            atualizarListaVisual();
        }

        function atualizarListaVisual() {
            const container = document.getElementById("listaKeysContainer");
            if (bancoDeKeys.length === 0) {
                container.innerText = "Nenhuma chave ativa.";
                return;
            }
            container.innerHTML = bancoDeKeys.map(k => `• ${k}<br>`).join('');
        }

        function fazerLogout() {
            document.getElementById("painelAdmin").style.display = "none";
            document.getElementById("telaLogin").style.display = "block";
            document.getElementById("password").value = "";
        }
    </script>
</body>
</html>
